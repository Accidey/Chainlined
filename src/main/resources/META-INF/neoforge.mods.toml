modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Give chainmail armor the rework it deserves. Hold any armor piece in your main hand and a
chainmail piece for the same slot in your offhand, then right-click to line the armor with it:
the lined armor gains extra defense and Impact Resistance, and a fully lined set shrugs off
sweeping attacks. Sneak-right-click with an empty offhand to take the lining back.

给锁链甲一次应得的重做。主手持任意护甲、副手持同部位的锁链甲，右键即可为护甲加上锁链内衬：
加衬的护甲获得额外防御与冲击抗性，而全套加衬护甲可以无视横扫攻击。
副手空手潜行右键，可以把内衬取回。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
